<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="งานดี — ระบบ Kanban จัดการงานทีม: เลือกบอร์ด ลากการ์ดข้ามคอลัมน์ กำหนดส่ง เช็คลิสต์ (เดโม)">
<title>งานดี — Kanban จัดการงานทีม</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='2' y='2' width='44' height='44' rx='12' fill='%230f766e'/%3E%3Crect x='10' y='12' width='7' height='24' rx='2' fill='%23fff'/%3E%3Crect x='20.5' y='12' width='7' height='17' rx='2' fill='%23fff' opacity='.85'/%3E%3Crect x='31' y='12' width='7' height='21' rx='2' fill='%23fff' opacity='.7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#0f766e; --accent-2:#115e59; --accent-soft:#e6f4f2; --accent-ink:#0b4f4a;
  --bg:#f3f6f5; --surface:#ffffff; --ink:#17252a; --muted:#5f6f74; --line:#dfe7e5;
  --danger:#dc2626; --danger-soft:#fee2e2; --ok:#15803d; --amber:#b45309;
  --radius:14px; --shadow:0 10px 30px rgba(15,60,58,.10);
  --font-th:'IBM Plex Sans Thai',system-ui,-apple-system,sans-serif;
  --font-num:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font-th);font-size:15.5px;line-height:1.65;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid rgba(15,118,110,.45);outline-offset:2px;border-radius:8px}
svg{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* === UX remediation === */
body{font-size:16px}

/* ---------- ENTRY: เลือกบอร์ด ---------- */
.entry{min-height:100vh;display:flex;flex-direction:column;padding:28px clamp(16px,5vw,64px) 40px;
  background:
    radial-gradient(900px 480px at 12% -10%,rgba(20,184,166,.30),transparent 60%),
    radial-gradient(760px 460px at 108% 112%,rgba(15,118,110,.28),transparent 55%),
    linear-gradient(160deg,#062622 0%,#0a3a36 55%,#062622 100%)}
.entry-head{display:flex;align-items:center;gap:14px;color:#fff;flex-wrap:wrap}
.entry-head .mark{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#14b8a6,#0f766e);display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.35);overflow:hidden}
.entry-head .mark img{width:100%;height:100%;object-fit:cover}
.entry-head h1{font-size:26px;font-weight:600;letter-spacing:.2px}
.entry-head .sub{color:#9fd8d1;font-size:13.5px;margin-top:-2px}
.entry-title{margin:clamp(28px,6vh,64px) 0 20px;color:#fff}
.entry-title h2{font-size:clamp(22px,3.2vw,34px);font-weight:600}
.entry-title p{color:#a9ddd7;font-size:14.5px;margin-top:4px}
.board-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;max-width:1200px;width:100%}
.board-card{position:relative;text-align:left;background:#fff;border:none;border-radius:18px;padding:0 0 18px;overflow:hidden;box-shadow:0 18px 44px rgba(2,30,28,.4);transition:transform .18s,box-shadow .18s;min-height:168px;display:flex;flex-direction:column}
.board-card:hover{transform:translateY(-4px);box-shadow:0 26px 56px rgba(2,30,28,.5)}
.board-card .band{height:64px;position:relative}
.board-card .band svg{position:absolute;right:12px;bottom:-14px;width:44px;height:44px;background:rgba(255,255,255,.2);border-radius:12px;padding:9px}
.board-card .bd{padding:20px 20px 0}
.board-card .nm{font-size:18px;font-weight:600;color:var(--ink)}
.board-card .meta{margin-top:8px;font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.board-card .open-hint{margin-top:auto;padding:14px 20px 0;font-size:13.5px;font-weight:500;color:var(--accent);display:flex;align-items:center;gap:6px}
.board-new{border:2px dashed rgba(255,255,255,.45);background:rgba(255,255,255,.06);border-radius:18px;min-height:168px;color:#d7f3ef;font-size:15.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:background .18s,border-color .18s}
.board-new:hover{background:rgba(255,255,255,.13);border-color:#5eead4}
.brandband{margin-top:auto;padding-top:44px;text-align:center;font-size:13px;color:#8ecfc8}
.brandband a{color:#5eead4;text-decoration:none;font-weight:500}
.brandband a:hover{text-decoration:underline}

/* ---------- APP SHELL ---------- */
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;min-height:64px;padding:10px clamp(14px,3vw,26px);
  background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar .mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#14b8a6,#0f766e);display:grid;place-items:center;flex:none;overflow:hidden}
.topbar .mark img{width:100%;height:100%;object-fit:cover}
.topbar h1{font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.topbar .crumb{font-size:13px;color:var(--muted);white-space:nowrap}
.topbar .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 18px;border:1.5px solid transparent;border-radius:11px;font-size:14.5px;font-weight:500;transition:background .15s,border-color .15s,color .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 5px 14px rgba(15,118,110,.28)}
.btn-primary:hover{background:var(--accent-2)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-sm{min-height:44px;padding:7px 14px;font-size:13.5px}

/* ---------- BOARD ---------- */
.board-wrap{padding:18px clamp(14px,3vw,26px) 120px}
.board-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat-chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:8px;min-height:36px}
.stat-chip b{color:var(--ink);font-family:var(--font-num)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:16px;align-items:start}
@media (max-width:640px){.cols{display:flex;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x mandatory}.col{flex:0 0 84vw;scroll-snap-align:start}}
.col{background:#e9efee;border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;max-height:calc(100vh - 210px);min-height:220px}
.col-head{display:flex;align-items:center;gap:9px;padding:13px 14px 10px}
.col-dot{width:10px;height:10px;border-radius:3px;flex:none}
.col-head h3{font-size:14.5px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-count{font-family:var(--font-num);font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.col-del{border:none;background:transparent;color:var(--muted);width:36px;height:36px;border-radius:9px;display:grid;place-items:center}
.col-del:hover{background:var(--danger-soft);color:var(--danger)}
.col-list{flex:1;overflow-y:auto;padding:4px 10px 10px;display:flex;flex-direction:column;gap:9px;min-height:60px}
.col-list.dragover{outline:2px dashed var(--accent);outline-offset:-4px;border-radius:12px;background:rgba(15,118,110,.06)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;box-shadow:0 1px 3px rgba(15,60,58,.07);cursor:grab;transition:box-shadow .15s,border-color .15s}
.card:hover{border-color:#b9d6d2;box-shadow:0 4px 12px rgba(15,60,58,.12)}
.card.dragging{opacity:.45;cursor:grabbing}
.card .lbls{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.card .lbl{height:8px;width:34px;border-radius:99px}
.card .ttl{font-size:14.5px;font-weight:500;line-height:1.5;word-break:break-word}
.card .foot{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
.due{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-family:var(--font-num)}
.due.over{color:var(--danger);font-weight:600}
.due svg{width:13px;height:13px}
.chk-mini{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-family:var(--font-num)}
.chk-mini svg{width:13px;height:13px}
.chk-bar{flex:1;min-width:54px;height:5px;background:#e5edec;border-radius:99px;overflow:hidden}
.chk-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.add-card{margin:0 10px 12px;min-height:44px;border:1.5px dashed #c3d4d1;background:transparent;border-radius:11px;color:var(--accent-ink);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:7px}
.add-card:hover{background:rgba(15,118,110,.07);border-color:var(--accent)}
.add-col-btn{min-height:56px;border:2px dashed #c3d4d1;background:rgba(255,255,255,.5);border-radius:16px;color:var(--accent-ink);font-weight:500;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.add-col-btn:hover{background:#fff;border-color:var(--accent)}
.empty-col{font-size:12.5px;color:var(--muted);text-align:center;padding:14px 8px;border:1px dashed #cfddda;border-radius:10px}

/* ---------- DRAWER / MODAL ---------- */
.overlay{position:fixed;inset:0;background:rgba(9,38,36,.45);backdrop-filter:blur(2px);z-index:700;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,94vw);background:#fff;z-index:720;box-shadow:-18px 0 48px rgba(9,38,36,.25);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .24s ease}
.drawer.show{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer-head h3{font-size:16.5px;font-weight:600;flex:1}
.drawer-body{flex:1;overflow-y:auto;padding:16px 18px}
.drawer .close-x{width:44px;height:44px;border:none;border-radius:10px;background:#f1f5f4;color:var(--muted);display:grid;place-items:center}
.drawer .close-x:hover{background:var(--danger-soft);color:var(--danger)}
.evt{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid #eef3f2;font-size:13.5px}
.evt:last-child{border-bottom:none}
.evt .sys{flex:none;font-size:11.5px;font-weight:600;border-radius:7px;padding:3px 9px;height:fit-content;font-family:var(--font-num)}
.evt .tm{color:var(--muted);font-size:12px;font-family:var(--font-num);margin-left:auto;flex:none}
.evt-empty{text-align:center;color:var(--muted);font-size:13.5px;padding:34px 10px}
.modal{position:fixed;inset:0;z-index:760;display:grid;place-items:center;padding:18px;background:rgba(9,38,36,.5);backdrop-filter:blur(2px)}
.modal-card{width:min(560px,100%);max-height:92vh;overflow-y:auto;background:#fff;border-radius:18px;padding:24px 24px 20px;box-shadow:0 30px 80px rgba(4,30,28,.45)}
.modal-card h3{font-size:17.5px;font-weight:600;margin-bottom:16px}
.field{margin-bottom:15px}
.field label{display:block;font-size:13.5px;font-weight:500;color:#33504c;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;min-height:46px;padding:10px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fbfdfd}
.field textarea{min-height:0;resize:vertical;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(15,118,110,.12);outline:none}
.lbl-pick{display:flex;gap:9px;flex-wrap:wrap}
.lbl-pick button{width:46px;height:34px;border-radius:9px;border:2px solid transparent;position:relative}
.lbl-pick button.on{border-color:var(--ink)}
.chk-row{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 0;border-bottom:1px solid #eef3f2}
.chk-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.chk-row .ct{flex:1;font-size:14.5px}
.chk-row input[type=checkbox]:checked+.ct{text-decoration:line-through;color:var(--muted)}
.chk-row .rm{border:none;background:transparent;color:var(--muted);width:36px;height:36px;border-radius:8px;display:grid;place-items:center}
.chk-row .rm:hover{background:var(--danger-soft);color:var(--danger)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.arch-item{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fbfdfd}
.arch-item .t{flex:1;font-size:14px;font-weight:500}
.arch-item .w{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#0b3a37;color:#dffaf6;padding:11px 20px;border-radius:99px;font-size:13.5px;z-index:900;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:640px){.topbar{gap:8px}.topbar .crumb{display:none}.board-wrap{padding-bottom:140px}}
</style>
</head>

<!-- ================= ENTRY: เลือกบอร์ด ================= -->
<section id="entry" class="entry">
  <div class="entry-head">
    <div class="mark" id="entryMark">
      <svg width="27" height="27" viewBox="0 0 48 48" fill="none"><rect x="8" y="8" width="8" height="32" rx="2.5" fill="#fff"/><rect x="20" y="8" width="8" height="22" rx="2.5" fill="#fff" opacity=".85"/><rect x="32" y="8" width="8" height="27" rx="2.5" fill="#fff" opacity=".7"/></svg>
    </div>
    <div>

  </div>
</section>

<!-- ================= APP ================= -->
<section id="app" hidden>
  <header class="topbar">
    <div class="mark" id="appMark">
      <svg width="21" height="21" viewBox="0 0 48 48" fill="none"><rect x="8" y="8" width="8" height="32" rx="2.5" fill="#fff"/><rect x="20" y="8" width="8" height="22" rx="2.5" fill="#fff" opacity=".85"/><rect x="32" y="8" width="8" height="27" rx="2.5" fill="#fff" opacity=".7"/></svg>
    </div>
    <div style="min-width:0">
      <h1 id="boardName">บอร์ด</h1>
      <div class="crumb">งานดี / บอร์ด</div>

    <button class="btn btn-ghost btn-sm" id="btnBoards">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="18" rx="1.5"/><rect x="14" y="3" width="7" height="11" rx="1.5"/></svg>
      ทุกบอร์ด
    </button>
    <button class="btn btn-ghost btn-sm" id="btnArchive">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/></svg>
      ถังงานเสร็จ <span class="num" id="archCount">0</span>
    </button>
    <button class="btn btn-ghost btn-sm" id="btnBridge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
      กิจกรรมข้ามระบบ
    </button>
    <button class="btn btn-ghost btn-sm" id="btnReset">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      รีเซ็ตข้อมูลตัวอย่าง
    </button>
  </header>

  <main class="board-wrap">
    <div class="board-stats" id="boardStats"></div>
    <div class="cols" id="cols"></div>
    <div style="margin-top:16px;max-width:320px">
      <button class="add-col-btn" id="btnAddCol">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        เพิ่มคอลัมน์
      </button>
    </div>
  </main>
</section>

<!-- overlay + drawers -->
<div class="overlay" id="overlay"></div>

<aside class="drawer" id="bridgeDrawer" aria-label="กิจกรรมข้ามระบบ">
  <div class="drawer-head">
    <h3>กิจกรรมข้ามระบบ</h3>
    <button class="close-x" data-close>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="bridgeBody"></div>
</aside>

<aside class="drawer" id="archDrawer" aria-label="ถังงานเสร็จ">
  <div class="drawer-head">
    <h3>ถังงานเสร็จ</h3>
    <button class="close-x" data-close>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>

</aside>

<div class="modal" id="modal" hidden>
  <div class="modal-card" id="modalCard"></div>

<script>
'use strict';
/* ================= BRIDGE (บังคับ) ================= */
var LINK_KEY='zx-link-v1';
function linkRead(){try{var d=JSON.parse(localStorage.getItem(LINK_KEY));return d&&d.events?d:{events:[]}}catch(e){return{events:[]}}}
function linkWrite(sys,type,msg,val){var l=linkRead();l.events.unshift({t:Date.now(),sys:sys,type:type,msg:msg,val:val===undefined?null:val});l.events=l.events.slice(0,60);try{localStorage.setItem(LINK_KEY,JSON.stringify(l))}catch(e){}}

/* ================= STORE ================= */
var STORE_KEY='zx-kanban2-v1';
var LABELS={green:'#16a34a',amber:'#d97706',red:'#dc2626',blue:'#2563eb',purple:'#7c3aed'};
var COL_DOTS=['#94a3b8','#0ea5e9','#d97706','#16a34a','#7c3aed','#dc2626'];
function uid(){return 'id'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function plusDays(n){var d=new Date();d.setDate(d.getDate()+n);return todayStr(d)}

function seed(){
  function card(title,due,labels,chk){return{id:uid(),title:title,due:due||'',labels:labels||[],checklist:(chk||[]).map(function(t,i){return{t:t,done:i===0}})}}
  return {boards:[
    {id:uid(),name:'งานร้านค้า',color:'#0f766e',columns:[
      {id:uid(),title:'To do',cards:[card('สั่งสต๊อกนมสดรอบเช้า',plusDays(2),['red'],['เช็กยอดคงเหลือ','โทรแจ้งซัพพลายเออร์','ยืนยันรอบส่ง']),card('จัดโปรโมชันปลายเดือน',plusDays(6),['amber'])]},
      {id:uid(),title:'Doing',cards:[card('ทำป้ายเมนูใหม่หน้าร้าน',plusDays(1),['blue'],['สเก็ตช์ร่าง','ส่งโรงพิมพ์'])]},
      {id:uid(),title:'Review',cards:[card('ตรวจยอดขายประจำสัปดาห์',todayStr(),['green'])]},
      {id:uid(),title:'Done',cards:[card('เปลี่ยนหลอดไฟโซนคาเฟ่','',['green'])]}
    ]},
    {id:uid(),name:'งานบ้าน',color:'#2563eb',columns:[
      {id:uid(),title:'To do',cards:[card('ซ่อมก๊อกน้ำห้องน้ำชั้นล่าง',plusDays(-1),['red'],['หาช่าง','ซื้ออะไหล่']),card('จ่ายค่าส่วนกลาง',plusDays(4),['amber'])]},
      {id:uid(),title:'Doing',cards:[card('ปลูกต้นไม้ริมระเบียง',plusDays(9),['green'])]},
      {id:uid(),title:'Review',cards:[]},
      {id:uid(),title:'Done',cards:[card('ล้างแอร์ห้องนอน','',['blue'])]}
    ]},
    {id:uid(),name:'โปรเจกต์ลูกค้า',color:'#7c3aed',columns:[
      {id:uid(),title:'To do',cards:[card('ส่งใบเสนอราคาเว็บร้านกาแฟ',plusDays(3),['red','amber'],['ร่าง scope','ประเมินชั่วโมง','ทำ PDF'])]},
      {id:uid(),title:'Doing',cards:[card('ออกแบบหน้าแรกเวอร์ชัน 2',plusDays(5),['purple'],['wireframe','เลือกฟอนต์'])]},
      {id:uid(),title:'Review',cards:[card('รีวิวโค้ดหน้าชำระเงิน',todayStr(),['blue'])]},
      {id:uid(),title:'Done',cards:[]}
    ]}
  ],archive:[],active:null};
}
function load(){try{var d=JSON.parse(localStorage.getItem(STORE_KEY));if(d&&d.boards&&d.boards.length)return d}catch(e){} return null}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){}}
var state=load();var fresh=!state;if(fresh){state=seed();save()}

/* ================= HELPERS ================= */
function $(s,r){return (r||document).querySelector(s)}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(function(){t.classList.remove('show')},2200)}
function board(){return state.boards.find(function(b){return b.id===state.active})||state.boards[0]}
function findCard(cid){var b=board();for(var i=0;i<b.columns.length;i++){var c=b.columns[i];for(var j=0;j<c.cards.length;j++){if(c.cards[j].id===cid)return{col:c,card:c.cards[j],idx:j}}}return null}
function thDate(iso){if(!iso)return '';var p=iso.split('-');var m=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];return parseInt(p[2],10)+' '+m[parseInt(p[1],10)-1]}
function chkPct(c){if(!c.checklist.length)return null;var d=c.checklist.filter(function(x){return x.done}).length;return Math.round(d/c.checklist.length*100)}
function isDoneCol(t){return/done|เสร็จ/i.test(t)}

/* ================= ENTRY ================= */
function renderEntry(){
  var g=$('#boardGrid');g.innerHTML='';
  state.boards.forEach(function(b){
    var total=b.columns.reduce(function(s,c){return s+c.cards.length},0);
    var dc=b.columns.find(function(c){return isDoneCol(c.title)});
    var done=dc?dc.cards.length:0;
    var btn=el('button','board-card');
    btn.innerHTML='<div class="band" style="background:linear-gradient(135deg,'+b.color+','+b.color+'cc)">'+
      '<svg viewBox="0 0 48 48" fill="none"><rect x="8" y="8" width="8" height="32" rx="2.5" fill="#fff"/><rect x="20" y="8" width="8" height="22" rx="2.5" fill="#fff" opacity=".85"/><rect x="32" y="8" width="8" height="27" rx="2.5" fill="#fff" opacity=".7"/></svg></div>'+
      '<div class="bd"><div class="nm">'+esc(b.name)+'</div>'+
      '<div class="meta"><span><b class="num">'+total+'</b> การ์ด</span><span><b class="num">'+b.columns.length+'</b> คอลัมน์</span><span>เสร็จ <b class="num">'+done+'</b></span></div></div>'+
      '<div class="open-hint">เปิดบอร์ด <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></div>';
    btn.addEventListener('click',function(){openBoard(b.id)});
    g.appendChild(btn);
  });
  var nb=el('button','board-new');
  nb.innerHTML='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>สร้างบอร์ดใหม่';
  nb.addEventListener('click',function(){openBoardModal()});
  g.appendChild(nb);
}
function openBoard(id){state.active=id;save();$('#entry').hidden=true;$('#app').hidden=false;renderBoard()}
function showEntry(){save();$('#app').hidden=true;$('#entry').hidden=false;renderEntry()}

/* ================= BOARD ================= */
var dragId=null;
function renderBoard(){
  var b=board();state.active=b.id;
  $('#boardName').textContent=b.name;
  var total=b.columns.reduce(function(s,c){return s+c.cards.length},0);
  var over=b.columns.reduce(function(s,c){return s+(isDoneCol(c.title)?0:c.cards.filter(function(x){return x.due&&x.due<todayStr()}).length)},0);
  $('#boardStats').innerHTML='<span class="stat-chip">การ์ดทั้งหมด <b>'+total+'</b></span>'+
    '<span class="stat-chip">คอลัมน์ <b>'+b.columns.length+'</b></span>'+
    (over?'<span class="stat-chip" style="color:var(--danger);border-color:#fecaca">เกินกำหนด <b>'+over+'</b></span>':'')+
    '<span class="stat-chip">เก็บเข้าถัง <b>'+state.archive.length+'</b></span>';
  $('#archCount').textContent=state.archive.length;

  var wrap=$('#cols');wrap.innerHTML='';
  b.columns.forEach(function(col,ci){
    var cEl=el('div','col');
    var head=el('div','col-head');
    head.innerHTML='<span class="col-dot" style="background:'+COL_DOTS[ci%COL_DOTS.length]+'"></span><h3>'+esc(col.title)+'</h3><span class="col-count">'+col.cards.length+'</span>';
    var del=el('button','col-del');del.title='ลบคอลัมน์';del.setAttribute('aria-label','ลบคอลัมน์ '+col.title);
    del.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>';
    del.addEventListener('click',function(){
      if(b.columns.length<=1){toast('ต้องมีอย่างน้อย 1 คอลัมน์');return}
      if(col.cards.length&&!window.confirm('คอลัมน์นี้มี '+col.cards.length+' การ์ด — การ์ดทั้งหมดจะถูกเก็บเข้าถังงานเสร็จ ยืนยันลบ?'))return;
      col.cards.forEach(function(c){state.archive.unshift({card:c,from:col.title,when:Date.now()})});
      b.columns.splice(ci,1);save();renderBoard();toast('ลบคอลัมน์แล้ว');
    });
    head.appendChild(del);cEl.appendChild(head);

    var list=el('div','col-list');list.dataset.col=col.id;
    list.addEventListener('dragover',function(e){e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect='move';list.classList.add('dragover')});
    list.addEventListener('dragleave',function(){list.classList.remove('dragover')});
    list.addEventListener('drop',function(e){
      e.preventDefault();list.classList.remove('dragover');
      var id=dragId;try{id=e.dataTransfer.getData('text/plain')||id}catch(_){}
      if(!id)return;
      var f=findCard(id);if(!f){dragId=null;return}
      var after=null;var y=e.clientY;
      var cards=[].slice.call(list.querySelectorAll('.card'));
      for(var k=0;k<cards.length;k++){var r=cards[k].getBoundingClientRect();if(y<r.top+r.height/2){after=cards[k].dataset.id;break}}
      f.col.cards.splice(f.idx,1);
      var toIdx=after?col.cards.findIndex(function(x){return x.id===after}):col.cards.length;
      if(toIdx<0)toIdx=col.cards.length;
      col.cards.splice(toIdx,0,f.card);
      if(isDoneCol(col.title)&&!isDoneCol(f.col.title)){
        linkWrite('kanban','task-done','งาน "'+f.card.title+'" เสร็จแล้ว (บอร์ด '+b.name+')');
        toast('ย้าย "'+f.card.title+'" → '+col.title);
      }
      save();renderBoard();dragId=null;
    });
    if(!col.cards.length){list.appendChild(el('div','empty-col','ลากการ์ดมาวางที่นี่'))}
    col.cards.forEach(function(c){list.appendChild(cardEl(c,col))});
    cEl.appendChild(list);

    var add=el('button','add-card');
    add.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>เพิ่มการ์ด';
    add.addEventListener('click',function(){openCardModal(null,col.id)});
    cEl.appendChild(add);
    wrap.appendChild(cEl);
  });
}
function cardEl(c,col){
  var e=el('div','card');e.draggable=true;e.dataset.id=c.id;
  var over=c.due&&c.due<todayStr()&&!isDoneCol(col.title);
  var pct=chkPct(c);
  var html='';
  if(c.labels.length){html+='<div class="lbls">'+c.labels.map(function(l){return '<span class="lbl" style="background:'+(LABELS[l]||'#94a3b8')+'"></span>'}).join('')+'</div>'}
  html+='<div class="ttl">'+esc(c.title)+'</div><div class="foot">';
  if(c.due){html+='<span class="due'+(over?' over':'')+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>'+thDate(c.due)+(over?' · เกินกำหนด':'')+'</span>'}
  if(pct!==null){html+='<span class="chk-mini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>'+c.checklist.filter(function(x){return x.done}).length+'/'+c.checklist.length+'</span><span class="chk-bar"><i style="width:'+pct+'%"></i></span>'}
  html+='</div>';
  e.innerHTML=html;
  e.addEventListener('dragstart',function(ev){dragId=c.id;e.classList.add('dragging');try{ev.dataTransfer.setData('text/plain',c.id);ev.dataTransfer.effectAllowed='move'}catch(_){}});
  e.addEventListener('dragend',function(){e.classList.remove('dragging');dragId=null});
  e.addEventListener('click',function(){openCardModal(c.id,col.id)});
  return e;
}

/* ================= MODALS ================= */
function openModal(html){$('#modalCard').innerHTML=html;$('#modal').hidden=false}
function closeModal(){$('#modal').hidden=true;$('#modalCard').innerHTML=''}
$('#modal').addEventListener('click',function(e){if(e.target===this)closeModal()});

function openBoardModal(){
  var colors=['#0f766e','#2563eb','#7c3aed','#dc2626','#d97706','#16a34a'];
  openModal('<h3>สร้างบอร์ดใหม่</h3>'+
    '<div class="field"><label for="nbName">ชื่อบอร์ด</label><input id="nbName" placeholder="เช่น งานทีมการตลาด" maxlength="60"></div>'+
    '<div class="field"><label>สีประจำบอร์ด</label><div class="lbl-pick" id="nbColors">'+colors.map(function(c,i){return '<button type="button" data-c="'+c+'" class="'+(i===0?'on':'')+'" style="background:'+c+'" aria-label="สีที่ '+(i+1)+'"></button>'}).join('')+'</div></div>'+
    '<div class="modal-actions"><button class="btn btn-ghost" id="nbCancel">ยกเลิก</button><button class="btn btn-primary" id="nbOk">สร้างบอร์ด</button></div>');
  var picked=colors[0];
  $('#nbColors').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;picked=b.dataset.c;[].forEach.call($('#nbColors').children,function(x){x.classList.toggle('on',x===b)})});
  $('#nbCancel').addEventListener('click',closeModal);
  $('#nbOk').addEventListener('click',function(){
    var name=$('#nbName').value.trim();if(!name){$('#nbName').focus();return}
    var b={id:uid(),name:name,color:picked,columns:[
      {id:uid(),title:'To do',cards:[]},{id:uid(),title:'Doing',cards:[]},{id:uid(),title:'Review',cards:[]},{id:uid(),title:'Done',cards:[]}]};
    state.boards.push(b);save();closeModal();
    linkWrite('kanban','board-new','สร้างบอร์ดใหม่ "'+name+'"');
    openBoard(b.id);toast('สร้างบอร์ด "'+name+'" แล้ว');
  });
  setTimeout(function(){var i=$('#nbName');if(i)i.focus()},50);
}

function openCardModal(cardId,colId){
  var b=board();var col=b.columns.find(function(c){return c.id===colId});
  var f=cardId?findCard(cardId):null;
  var c=f?f.card:{id:uid(),title:'',due:'',labels:[],checklist:[]};
  openModal('<h3>'+(f?'แก้ไขการ์ด':'เพิ่มการ์ด — '+esc(col.title))+'</h3>'+
    '<div class="field"><label for="cTitle">ชื่องาน</label><input id="cTitle" maxlength="120" placeholder="สิ่งที่ต้องทำ" value="'+esc(c.title)+'"></div>'+
    '<div class="field"><label for="cDue">กำหนดส่ง</label><input id="cDue" type="date" value="'+c.due+'"></div>'+
    '<div class="field"><label>ป้ายสี</label><div class="lbl-pick" id="cLabels">'+Object.keys(LABELS).map(function(k){return '<button type="button" data-l="'+k+'" class="'+(c.labels.indexOf(k)>=0?'on':'')+'" style="background:'+LABELS[k]+'" aria-label="ป้าย '+k+'"></button>'}).join('')+'</div></div>'+
    '<div class="field"><label>เช็คลิสต์ย่อย</label><div id="cChk"></div><div style="display:flex;gap:8px;margin-top:8px"><input id="cChkNew" aria-label="เพิ่มรายการย่อย" placeholder="เพิ่มรายการย่อย" style="flex:1;min-height:44px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px"><button class="btn btn-ghost btn-sm" id="cChkAdd">เพิ่ม</button></div></div>'+
    '<div class="modal-actions">'+(f?'<button class="btn btn-danger" id="cDel" style="margin-right:auto">ลบการ์ด</button>':'')+
    '<button class="btn btn-ghost" id="cCancel">ยกเลิก</button><button class="btn btn-primary" id="cOk">'+(f?'บันทึก':'เพิ่มการ์ด')+'</button></div>');

  var chk=c.checklist;
  function renderChk(){
    $('#cChk').innerHTML=chk.map(function(x,i){return '<div class="chk-row"><input type="checkbox" data-i="'+i+'"'+(x.done?' checked':'')+'><span class="ct">'+esc(x.t)+'</span><button class="rm" data-i="'+i+'" aria-label="ลบรายการย่อย"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>'}).join('')||'<div style="font-size:13px;color:var(--muted);padding:6px 0">ยังไม่มีรายการย่อย</div>';
  }
  renderChk();
  $('#cChk').addEventListener('change',function(e){if(e.target.type==='checkbox'){chk[+e.target.dataset.i].done=e.target.checked;renderChk()}});
  $('#cChk').addEventListener('click',function(e){var rm=e.target.closest('.rm');if(rm){chk.splice(+rm.dataset.i,1);renderChk()}});
  $('#cChkAdd').addEventListener('click',function(){var v=$('#cChkNew').value.trim();if(!v)return;chk.push({t:v,done:false});$('#cChkNew').value='';renderChk()});
  $('#cLabels').addEventListener('click',function(e){var b2=e.target.closest('button');if(!b2)return;b2.classList.toggle('on')});
  $('#cCancel').addEventListener('click',closeModal);
  if(f){$('#cDel').addEventListener('click',function(){f.col.cards.splice(f.idx,1);save();closeModal();renderBoard();toast('ลบการ์ดแล้ว')})}
  $('#cOk').addEventListener('click',function(){
    var title=$('#cTitle').value.trim();if(!title){$('#cTitle').focus();return}
    c.title=title;c.due=$('#cDue').value;
    c.labels=[].map.call($('#cLabels').querySelectorAll('button.on'),function(x){return x.dataset.l});
    if(!f)col.cards.unshift(c);
    save();closeModal();renderBoard();toast(f?'บันทึกการ์ดแล้ว':'เพิ่มการ์ด "'+title+'" แล้ว');
  });
  setTimeout(function(){var i=$('#cTitle');if(i)i.focus()},50);
}

/* ================= DRAWERS ================= */
var SYS_STYLE={kanban:['#0f766e','#e6f4f2','งานดี'],cashbook:['#15803d','#e8f7ee','เงินดี'],sales:['#0369a1','#e3f0f9','ยอดขายดี']};
function openDrawer(sel){$(sel).classList.add('show');$('#overlay').classList.add('show')}
function closeDrawers(){[].forEach.call(document.querySelectorAll('.drawer'),function(d){d.classList.remove('show')});$('#overlay').classList.remove('show')}
$('#overlay').addEventListener('click',closeDrawers);
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeDrawers();closeModal()}});
[].forEach.call(document.querySelectorAll('[data-close]'),function(b){b.addEventListener('click',closeDrawers)});

function renderBridge(){
  var ev=linkRead().events;var body=$('#bridgeBody');
  if(!ev.length){body.innerHTML='<div class="evt-empty">ยังไม่มีกิจกรรมจากระบบใด<br>ลองใช้งานระบบอื่นในชุดเดโมนี้ดู</div>';return}
  body.innerHTML=ev.map(function(e){
    var s=SYS_STYLE[e.sys]||['#64748b','#f1f5f9',e.sys];
    var d=new Date(e.t);
    return '<div class="evt"><span class="sys" style="color:'+s[0]+';background:'+s[1]+'">'+s[2]+'</span><div>'+esc(e.msg)+'</div><span class="tm">'+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')+'</span></div>';
  }).join('');
}
function renderArch(){
  var body=$('#archBody');
  if(!state.archive.length){body.innerHTML='<div class="evt-empty">ถังว่าง — ลบคอลัมน์หรือเก็บการ์ดเสร็จแล้วจะมาอยู่ที่นี่</div>';return}
  body.innerHTML='';
  state.archive.forEach(function(a,i){
    var d=el('div','arch-item');
    d.innerHTML='<div class="t">'+esc(a.card.title)+'<div class="w">จากคอลัมน์ '+esc(a.from)+'</div></div>';
    var rs=el('button','btn btn-ghost btn-sm','กู้คืน');
    rs.addEventListener('click',function(){
      var b=board();var done=b.columns.find(function(c){return isDoneCol(c.title)})||b.columns[0];
      done.cards.push(a.card);state.archive.splice(i,1);save();renderBoard();renderArch();toast('กู้คืนการ์ดแล้ว');
    });
    d.appendChild(rs);body.appendChild(d);
  });
}
$('#btnBridge').addEventListener('click',function(){renderBridge();openDrawer('#bridgeDrawer')});
$('#btnArchive').addEventListener('click',function(){renderArch();openDrawer('#archDrawer')});

/* ================= ACTIONS ================= */
$('#btnBoards').addEventListener('click',showEntry);
$('#btnAddCol').addEventListener('click',function(){
  var name=window.prompt('ชื่อคอลัมน์ใหม่','งานค้าง');if(!name||!name.trim())return;
  board().columns.push({id:uid(),title:name.trim(),cards:[]});save();renderBoard();toast('เพิ่มคอลัมน์ "'+name.trim()+'"');
});
$('#btnReset').addEventListener('click',function(){
  if(!window.confirm('รีเซ็ตข้อมูลตัวอย่าง? ข้อมูลทั้งหมดของระบบนี้จะกลับเป็นค่าเริ่มต้น'))return;
  localStorage.removeItem(STORE_KEY);state=seed();save();showEntry();toast('รีเซ็ตข้อมูลตัวอย่างแล้ว');
});

/* ================= BOOT ================= */
(function boot(){
  ['entryMark','appMark'].forEach(function(id){
    var m=document.getElementById(id);if(!m)return;
    var img=new Image();img.alt='';img.src='assets/logo.jpg';
    img.onload=function(){m.innerHTML='';m.appendChild(img)};
  });
  var skip=/[?&]app=1/.test(location.search)||window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(skip){openBoard(state.active||state.boards[0].id)}else{showEntry()}
})();
</script>
</body>
</html>
